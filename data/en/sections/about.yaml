summary: "I am a statistician and energy analytics professional with experience developing forecasting, reporting, and decision-support systems for utility operations. Currently, I work at Bonneville Power Administration supporting operational analytics and grid forecasting for the Pacific Northwest energy system.\n\nMy technical interests include time-series forecasting, operational analytics, automation, data visualization, and statistical modeling using tools such as R, R-Shiny, Python, and SQL. I enjoy building practical systems that transform complex data into actionable operational insights."
